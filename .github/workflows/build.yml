name: Build Comet Busters

on:
  push:
    branches: [ main, dev ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '**.yml'
      - '**.yaml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '**.yml'
      - '**.yaml'
  workflow_dispatch:

env:
  PRODUCT_VERSION: "1.0.${{ github.run_number }}.0"
  UPGRADE_CODE: "A8F2B5C3-9D47-44E2-8B6A-7C3F1E9A2D5B"

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86
            vcpkg_triplet: x86-windows
            cmake_arch: Win32
            artifact_name: cometbuster-build-x86
            zip_name: CometBuster-Portable-x86.zip
          - arch: arm64
            vcpkg_triplet: arm64-windows
            cmake_arch: ARM64
            artifact_name: cometbuster-build-arm64
            zip_name: CometBuster-Portable-arm64.zip
    outputs:
      version: ${{ env.PRODUCT_VERSION }}

    steps:
    - uses: actions/checkout@v4

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        .\vcpkg\bootstrap-vcpkg.bat

    - name: Install dependencies (${{ matrix.vcpkg_triplet }})
      run: |
        .\vcpkg\vcpkg.exe install --triplet ${{ matrix.vcpkg_triplet }} --x-manifest-root=. --x-install-root=vcpkg\installed

    - name: Configure
      run: |
        cmake -B build-${{ matrix.arch }} -A ${{ matrix.cmake_arch }} `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}\vcpkg\installed" `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cmake --build build-${{ matrix.arch }} --config Release --target cometbuster

    - name: Convert PNG icon to ICO
      run: |
        if (Test-Path "icon.png") {
          magick icon.png -resize 256x256 -colors 256 icon.ico
        } else {
          Write-Host "⚠️  icon.png not found at repo root"
        }

    - name: Package
      run: |
        New-Item -ItemType Directory -Force -Path "package" | Out-Null
        Copy-Item "build-${{ matrix.arch }}\Release\cometbuster.exe" "package\"
        Copy-Item "vcpkg\installed\${{ matrix.vcpkg_triplet }}\bin\*.dll" "package\" -ErrorAction SilentlyContinue
        Copy-Item "README.md" "package\" -ErrorAction SilentlyContinue
        Copy-Item "LICENSE.md" "package\" -ErrorAction SilentlyContinue
        Copy-Item "icon.png" "package\" -ErrorAction SilentlyContinue
        Copy-Item "icon.ico" "package\" -ErrorAction SilentlyContinue

        if (Test-Path "build-${{ matrix.arch }}\Release\cometbuster.wad") {
          Copy-Item "build-${{ matrix.arch }}\Release\cometbuster.wad" "package\"
        } elseif (Test-Path "cometbuster.wad") {
          Copy-Item "cometbuster.wad" "package\"
        } else {
          Write-Error "cometbuster.wad not found — CMake's WAD build step may have failed"
          exit 1
        }

        if (-not (Test-Path "package\cometbuster.exe")) {
          Write-Error "cometbuster.exe not found — build failed"
          exit 1
        }
        if (-not (Test-Path "package\cometbuster.wad")) {
          Write-Error "cometbuster.wad not found — packaging would produce a broken zip"
          exit 1
        }

        $dllCount = (Get-ChildItem "package\*.dll" -ErrorAction SilentlyContinue).Count
        Write-Host "📦 Packaged $dllCount DLL(s):"
        Get-ChildItem "package\*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  - $($_.Name) ($($_.Length) bytes)" }

        Compress-Archive -Path "package\*" -DestinationPath "${{ matrix.zip_name }}"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.zip_name }}
        retention-days: 7

  build-msi-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts (x86)
      uses: actions/download-artifact@v4
      with:
        name: cometbuster-build-x86
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "CometBuster-Portable-x86.zip" -DestinationPath "artifacts/build/windows/" -Force

    - name: Setup WiX Toolset
      run: |
        Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "wix.zip"
        Expand-Archive -Path "wix.zip" -DestinationPath "wix"
        echo "$env:GITHUB_WORKSPACE\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Generate MSI Installer
      working-directory: artifacts/build/windows
      run: |
        $version = "${{ env.PRODUCT_VERSION }}"
        $upgradeCode = "${{ env.UPGRADE_CODE }}"

        # Generate component entries for all DLLs
        $dllEntries = Get-ChildItem -Name "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
          $safeId = $_ -replace '[^a-zA-Z0-9]', '_'
          "                <File Id=`"$safeId`" Name=`"$_`" Source=`"$_`"/>"
        }

        @"
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">

          <Product Id="*"
                   Name="Comet Busters"
                   Language="1033"
                   Version="$version"
                   Manufacturer="Jason Brian Hall"
                   UpgradeCode="$upgradeCode">

            <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine"
                     Description="Comet Busters - Action Arcade Game"
                     Manufacturer="Jason Brian Hall" />

            <MajorUpgrade DowngradeErrorMessage="A newer version of Comet Busters is already installed. Please uninstall it first."
                          Schedule="afterInstallInitialize" />
            <MediaTemplate EmbedCab="yes" CompressionLevel="high" />

            <Icon Id="CometBusterIcon" SourceFile="icon.ico" />
            <Property Id="ARPPRODUCTICON" Value="CometBusterIcon" />
            <Property Id="ARPHELPLINK" Value="https://github.com" />
            <Property Id="ARPURLINFOABOUT" Value="https://github.com" />
            <Property Id="ARPCOMMENTS" Value="An exciting asteroid-busting action arcade game" />

            <WixVariable Id="WixUILicenseRtf" Value="License.rtf" />
            <Property Id="WIXUI_INSTALLDIR" Value="INSTALLFOLDER" />
            <Property Id="DESKTOP_SHORTCUT" Value="1" />

            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFilesFolder">
                <Directory Id="INSTALLFOLDER" Name="Comet Busters" />
              </Directory>
              <Directory Id="ProgramMenuFolder">
                <Directory Id="ApplicationProgramsFolder" Name="Comet Busters" />
              </Directory>
              <Directory Id="DesktopFolder" />
            </Directory>

            <!-- Main executable, WAD and all DLL dependencies -->
            <DirectoryRef Id="INSTALLFOLDER">
              <Component Id="MainExecutable" Guid="E5D4C8B7-9F2A-4C3D-8E1F-5A6B7C8D9E0F" Win64="no">
                <File Id="CometBusterEXE" Name="cometbuster.exe" Source="cometbuster.exe" />
                <File Id="CometBusterWAD" Name="cometbuster.wad" Source="cometbuster.wad" />

                <Shortcut Id="StartMenuShortcut"
                          Directory="ApplicationProgramsFolder"
                          Name="Comet Busters"
                          Description="Comet Busters - Action Arcade Game"
                          Target="[INSTALLFOLDER]cometbuster.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="CometBusterIcon"
                          IconIndex="0" />

                <RegistryValue Root="HKCU" Key="Software\Comet Busters" Name="installed"
                               Type="integer" Value="1" KeyPath="yes" />

                <!-- DLL dependencies -->
                $($dllEntries -join "`r`n")
              </Component>
            </DirectoryRef>

            <DirectoryRef Id="ApplicationProgramsFolder">
              <Component Id="StartMenuFolder" Guid="A0B1C2D3-E4F5-4D6E-9F0A-7B8C9D0E1F2A" Win64="no">
                <RemoveFolder Id="ApplicationProgramsFolderRemove" On="uninstall" />
                <RegistryValue Root="HKCU" Key="Software\Comet Busters\Shortcuts" Name="StartMenu"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <DirectoryRef Id="DesktopFolder">
              <Component Id="DesktopShortcut" Guid="B1C2D3E4-F5A6-4E7F-0A1B-8C9D0E1F2A3B" Win64="no">
                <Condition>DESKTOP_SHORTCUT=1</Condition>
                <Shortcut Id="DesktopShortcutMain"
                          Directory="DesktopFolder"
                          Name="Comet Busters"
                          Description="Comet Busters - Action Arcade Game"
                          Target="[INSTALLFOLDER]cometbuster.exe"
                          WorkingDirectory="INSTALLFOLDER"
                          Icon="CometBusterIcon"
                          IconIndex="0" />
                <RegistryValue Root="HKCU" Key="Software\Comet Busters\Shortcuts" Name="Desktop"
                               Type="integer" Value="1" KeyPath="yes" />
              </Component>
            </DirectoryRef>

            <Feature Id="MainFeature" Title="Comet Busters" Level="1">
              <ComponentRef Id="MainExecutable" />
              <ComponentRef Id="StartMenuFolder" />
              <ComponentRef Id="DesktopShortcut" />
            </Feature>

            <UIRef Id="WixUI_InstallDir" />
            <UIRef Id="WixUI_ErrorProgressText" />

            <InstallExecuteSequence>
              <Custom Action="SetARPINSTALLLOCATION" After="InstallValidate" />
            </InstallExecuteSequence>
            <CustomAction Id="SetARPINSTALLLOCATION" Property="ARPINSTALLLOCATION" Value="[INSTALLFOLDER]" />

          </Product>
        </Wix>
        "@ | Out-File -FilePath "cometbuster.wxs" -Encoding UTF8

        if (-not (Test-Path "License.rtf")) {
          @"
        {\rtf1\ansi\ansicpg1252
        {\colortbl;\red255\green255\blue255;}
        \margl1440\margr1440\vieww11900\viewh8605\viewkind0
        \pard\tx720\tx1440\tx2160\tx2880\tx3600\tx4320\pardirnatural\partightenfactor0
        \f0\fs20 \cf0 MIT License\
        \
        Copyright (c) 2025 Jason Brian Hall\
        \
        Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:\
        \
        The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.\
        \
        THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.}
        "@ | Out-File -FilePath "License.rtf" -Encoding ASCII
        }

        Write-Host "Compiling WXS..."
        & candle.exe -out "cometbuster.wixobj" -arch x86 "cometbuster.wxs"
        if ($LASTEXITCODE -ne 0) { Write-Error "Candle failed"; exit 1 }

        Write-Host "Linking MSI..."
        & light.exe -out "CometBuster.msi" -ext WixUIExtension -ext WixUtilExtension "cometbuster.wixobj"
        if ($LASTEXITCODE -ne 0) { Write-Error "Light failed"; exit 1 }

        if (Test-Path "CometBuster.msi") {
          Write-Host "✅ MSI created: CometBuster.msi ($((Get-Item 'CometBuster.msi').Length) bytes)"
        } else {
          Write-Error "❌ MSI not created"; exit 1
        }

    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: CometBuster.msi
        path: artifacts/build/windows/CometBuster.msi
        retention-days: 7

  build-msix-windows:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: x86
            artifact_name: cometbuster-build-x86
            zip_name: CometBuster-Portable-x86.zip
          - arch: arm64
            artifact_name: cometbuster-build-arm64
            zip_name: CometBuster-Portable-arm64.zip

    steps:
    - uses: actions/checkout@v4

    - name: Download Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: .

    - name: Extract Build Files
      run: |
        Expand-Archive -Path "${{ matrix.zip_name }}" -DestinationPath "msix-source\" -Force

    - name: Prepare MSIX Package Structure
      run: |
        New-Item -ItemType Directory -Force -Path "msix-package/Assets"
        New-Item -ItemType Directory -Force -Path "msix-package/Files"

        Copy-Item "msix-source/*" -Destination "msix-package/Files/" -Recurse -Force

        if (-not (Test-Path "msix-package/Files/cometbuster.exe")) {
          Write-Error "cometbuster.exe not found in package!"
          exit 1
        }
        if (-not (Test-Path "msix-package/Files/cometbuster.wad")) {
          Write-Error "cometbuster.wad not found in package!"
          exit 1
        }

        Write-Host "📦 MSIX Files directory contents:"
        Get-ChildItem "msix-package/Files/" -File | ForEach-Object {
          $size = "{0:N0}" -f $_.Length
          Write-Host "  - $($_.Name) ($size bytes)"
        }

    - name: Create MSIX Store Compliant Assets
      run: |
        $iconPath = "msix-source/icon.png"

        if (-not (Test-Path $iconPath)) {
          Write-Error "icon.png not found - cannot create Store assets"
          exit 1
        }

        Write-Host "Creating Microsoft Store compliant assets..."

        & magick "$iconPath" -resize 50x50   "msix-package/Assets/StoreLogo.scale-100.png"
        & magick "$iconPath" -resize 63x63   "msix-package/Assets/StoreLogo.scale-125.png"
        & magick "$iconPath" -resize 75x75   "msix-package/Assets/StoreLogo.scale-150.png"
        & magick "$iconPath" -resize 100x100 "msix-package/Assets/StoreLogo.scale-200.png"

        & magick "$iconPath" -resize 44x44 "msix-package/Assets/CometBuster44x44.scale-100.png"
        & magick "$iconPath" -resize 55x55 "msix-package/Assets/CometBuster44x44.scale-125.png"
        & magick "$iconPath" -resize 66x66 "msix-package/Assets/CometBuster44x44.scale-150.png"
        & magick "$iconPath" -resize 88x88 "msix-package/Assets/CometBuster44x44.scale-200.png"

        & magick "$iconPath" -resize 150x150 "msix-package/Assets/CometBusterLogo.scale-100.png"
        & magick "$iconPath" -resize 188x188 "msix-package/Assets/CometBusterLogo.scale-125.png"
        & magick "$iconPath" -resize 225x225 "msix-package/Assets/CometBusterLogo.scale-150.png"
        & magick "$iconPath" -resize 300x300 "msix-package/Assets/CometBusterLogo.scale-200.png"

        & magick "$iconPath" -resize 150x150 -background "#1a1a2e" -gravity center -extent 310x150 "msix-package/Assets/CometBusterWide.scale-100.png"
        & magick "$iconPath" -resize 188x188 -background "#1a1a2e" -gravity center -extent 388x188 "msix-package/Assets/CometBusterWide.scale-125.png"
        & magick "$iconPath" -resize 225x225 -background "#1a1a2e" -gravity center -extent 465x225 "msix-package/Assets/CometBusterWide.scale-150.png"
        & magick "$iconPath" -resize 300x300 -background "#1a1a2e" -gravity center -extent 620x300 "msix-package/Assets/CometBusterWide.scale-200.png"

        Write-Host "✅ All Microsoft Store assets created successfully"

    - name: Create MSIX Manifest
      working-directory: msix-package
      run: |
        @"
        <?xml version="1.0" encoding="utf-8"?>
        <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                 xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                 xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">

          <Identity
            Name="JasonBrianHall.15700415EB853"
            Publisher="CN=7A3CF65F-504C-42F2-BABD-6A0512A0A017"
            Version="${{ env.PRODUCT_VERSION }}"
            ProcessorArchitecture="${{ matrix.arch }}" />

          <Properties>
            <DisplayName>CometBusters</DisplayName>
            <PublisherDisplayName>Jason Brian Hall</PublisherDisplayName>
            <Description>Blast asteroids and comets in this action-packed arcade game!</Description>
            <Logo>Assets\StoreLogo.scale-100.png</Logo>
          </Properties>

          <Dependencies>
            <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
          </Dependencies>

          <Resources>
            <Resource Language="en-us" />
          </Resources>

          <Applications>
            <Application Id="CometBuster" Executable="Files\cometbuster.exe" EntryPoint="Windows.FullTrustApplication">
              <uap:VisualElements DisplayName="CometBusters"
                                  Description="Blast asteroids and comets in this action-packed arcade game!"
                                  Square150x150Logo="Assets\CometBusterLogo.scale-100.png"
                                  Square44x44Logo="Assets\CometBuster44x44.scale-100.png"
                                  BackgroundColor="#1a1a2e">
                <uap:DefaultTile Wide310x150Logo="Assets\CometBusterWide.scale-100.png"
                                ShortName="CometBusters">
                  <uap:ShowNameOnTiles>
                    <uap:ShowOn Tile="square150x150Logo"/>
                    <uap:ShowOn Tile="wide310x150Logo"/>
                  </uap:ShowNameOnTiles>
                </uap:DefaultTile>
                <uap:SplashScreen Image="Assets\CometBusterLogo.scale-100.png" />
              </uap:VisualElements>
            </Application>
          </Applications>

          <Capabilities>
            <rescap:Capability Name="runFullTrust" />
          </Capabilities>
        </Package>
        "@ | Out-File -FilePath "AppxManifest.xml" -Encoding UTF8

    - name: Build MSIX Package
      run: |
        $makeAppxPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\makeappx.exe"

        if (-not (Test-Path $makeAppxPath)) {
          $sdkVersions = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\" |
            Where-Object { $_.Name -match "10\.0\.\d+\.\d+" } |
            Sort-Object Name -Descending
          foreach ($version in $sdkVersions) {
            $testPath = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$($version.Name)\x64\makeappx.exe"
            if (Test-Path $testPath) { $makeAppxPath = $testPath; break }
          }
        }

        if (-not (Test-Path $makeAppxPath)) {
          Write-Error "MakeAppx.exe not found."
          exit 1
        }

        Write-Host "Using MakeAppx at: $makeAppxPath"
        $msixName = "CometBuster-${{ matrix.arch }}.msix"
        & "$makeAppxPath" pack /d "msix-package" /p "$msixName" /o

        if ($LASTEXITCODE -ne 0) { Write-Error "MSIX creation failed"; exit 1 }

        if (Test-Path $msixName) {
          Write-Host "✅ MSIX created: $msixName ($((Get-Item $msixName).Length) bytes)"
          Write-Host "Package is unsigned and ready for Microsoft Store submission"
        } else {
          Write-Error "❌ MSIX not created"; exit 1
        }

    - name: Upload MSIX
      uses: actions/upload-artifact@v4
      with:
        name: CometBuster-${{ matrix.arch }}.msix
        path: CometBuster-${{ matrix.arch }}.msix
        retention-days: 7

  create-release:
    needs: [build-windows, build-msi-windows, build-msix-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push'

    steps:
    - name: Download MSI Artifact
      uses: actions/download-artifact@v4
      with:
        name: CometBuster.msi
        path: release

    - name: Download MSIX Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: CometBuster-*.msix
        path: release
        merge-multiple: true

    - name: Download Portable Artifact (x86)
      uses: actions/download-artifact@v4
      with:
        name: cometbuster-build-x86
        path: release

    - name: Download Portable Artifact (arm64)
      uses: actions/download-artifact@v4
      with:
        name: cometbuster-build-arm64
        path: release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/CometBuster.msi
          release/CometBuster-x86.msix
          release/CometBuster-arm64.msix
          release/CometBuster-Portable-x86.zip
          release/CometBuster-Portable-arm64.zip
        tag_name: ${{ github.ref == 'refs/heads/main' && format('v{0}', github.run_number) || format('dev-v{0}', github.run_number) }}
        name: ${{ github.ref == 'refs/heads/main' && format('Release v{0}', github.run_number) || format('Dev Build v{0}', github.run_number) }}
        draft: false
        prerelease: ${{ github.ref != 'refs/heads/main' }}
        make_latest: ${{ github.ref == 'refs/heads/main' }}
        body: |
          ## ${{ github.ref == 'refs/heads/main' && 'Stable Release' || 'Development Build' }}

          **Version:** ${{ env.PRODUCT_VERSION }}
          **Commit:** ${{ github.sha }}
          **Build:** #${{ github.run_number }}

          ### 🌠 Comet Busters
          An exciting asteroid-busting action arcade game, built natively with MSVC for x86 and ARM64.

          ### 📦 Downloads
          - **CometBuster.msi** — Windows installer (x86) with Start Menu and optional desktop shortcuts
          - **CometBuster-x86.msix / CometBuster-arm64.msix** — Unsigned packages ready for Microsoft Store submission
          - **CometBuster-Portable-x86.zip / CometBuster-Portable-arm64.zip** — Portable, no installation required

          ### 🏪 Microsoft Store Submission
          MSIX packages are **unsigned**. Before uploading via Partner Center:
          1. Update `Identity Name` and `Publisher` in the manifest with your Partner Center values
          2. Upload the unsigned MSIX — Microsoft handles signing during certification

          ### 🎯 Silent Installation (MSI, x86 only)
          ```cmd
          msiexec /i CometBuster.msi /quiet /norestart DESKTOP_SHORTCUT=1
          msiexec /x CometBuster.msi /quiet /norestart
          ```

          ---
          *Built with ❤️ using GitHub Actions and MSVC*
